<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Spots Project" />
    <meta name="author" content="Kaitlynn Oxley" />
    <meta name="keywords" content="HTML, CSS" />
    <title>Spots</title>
  </head>
  <body>
    <div class="page">
      <header class="header">
        <img
          src="<%=require('./images/Logo.svg')%>"
          alt="Spot Logo"
          class="header__logo"
        />
      </header>
      <main class="content">
        <section class="profile page__section">
          <div class="profile__avatar-container">
            <button class="profile__avatar-button">
              <img
                class="profile__pencil-icon"
                src="<%=require('./images/Whitepencil.svg')%>"
                alt="Avatar overlay"
              />
            </button>
            <img src="#" alt="Bessie Coleman" class="profile__avatar" />
          </div>
          <div class="profile__column">
            <h1 class="profile__name"></h1>
            <p class="profile__description"></p>
            <button type="button" class="profile__edit-button">
              <img
                src="<%=require('./images/pencil.svg')%>"
                alt="Pencil icon"
              />Edit Profile
            </button>
          </div>
          <button type="button" class="profile__add-button">
            <img src="<%=require('./images/plus.svg')%>" alt="Plus icon" />New
            Post
          </button>
        </section>
        <section class="cards page__section">
          <ul class="cards__list">
            <template id="card-template">
              <li class="card">
                <button type="button" class="card__trash-button"></button>
                <img src="" alt="" class="card__image" />
                <div class="card__content">
                  <h2 class="card__title"></h2>
                  <button type="button" class="card__like-button"></button>
                </div>
              </li>
            </template>
          </ul>
        </section>
      </main>
      <footer class="footer">
        <p class="footer__content">2024 &copy; Spots</p>
      </footer>
    </div>

    <div class="modal" id="edit-modal">
      <div class="modal__container">
        <button type="button" class="modal__close-button"></button>
        <h2 class="modal__title">Edit profile</h2>
        <form name="edit-profile" class="modal__form" novalidate>
          <label for="profile-name-input" class="modal__label">
            Name
            <input
              placeholder="Type your name"
              id="profile-name-input"
              type="text"
              minlength="2"
              maxlength="40"
              class="modal__input"
              required
            />
            <span id="profile-name-input-error" class="modal__error"></span>
          </label>
          <label for="profile-description-input" class="modal__label">
            Description
            <input
              placeholder="Describe yourself"
              id="profile-description-input"
              type="text"
              minlength="2"
              maxlength="200"
              class="modal__input"
              required
            />
            <span
              id="profile-description-input-error"
              class="modal__error"
            ></span>
          </label>
          <button type="submit" class="modal__submit-button">Save</button>
        </form>
      </div>
    </div>

    <div class="modal" id="add-card-modal">
      <div class="modal__container">
        <button type="button" class="modal__close-button"></button>
        <h2 class="modal__title">New post</h2>
        <form class="modal__form" id="add-card-form" novalidate>
          <label for="add-card-link-input" class="modal__label">
            Image link
            <input
              placeholder="Paste a link to the picture"
              id="add-card-link-input"
              type="url"
              class="modal__input"
              name="link"
              required
            />
            <span id="add-card-link-input-error" class="modal__error"></span>
          </label>
          <label for="add-card-name-input" class="modal__label">
            Caption
            <input
              placeholder="Type your caption"
              id="add-card-name-input"
              type="text"
              minlength="2"
              maxlength="30"
              class="modal__input"
              name="name"
              required
            />
            <span id="add-card-name-input-error" class="modal__error"></span>
          </label>
          <button type="submit" class="modal__submit-button">Save</button>
        </form>
      </div>
    </div>

    <div class="modal" id="preview-modal">
      <div class="modal__container modal__preview-container">
        <button
          aria-label="Close modal"
          class="modal__close-button modal__preview-close-button"
          type="button"
        ></button>
        <img class="modal__image" src="" alt="" />
        <p class="modal__caption">Restaurant Terrace</p>
      </div>
    </div>

    <div class="modal" id="avatar-modal">
      <div class="modal__content modal__content-avatar">
        <button
          type="button"
          class="modal__close-button modal__avatar-close-button"
          aria-label="Close modal"
        ></button>
        <h3 class="modal__title modal__title-avatar">Edit profile avatar</h3>
        <form id="edit-avatar-form" class="modal__form">
          <label
            for="profile-avatar-input"
            class="modal__label modal__label-avatar"
          >
            Profile Picture
            <input
              placeholder="Avatar goes here"
              name="avatar"
              id="profile-avatar-input"
              class="modal__input modal__input-avatar"
              type="url"
              required
            />
            <span id="profile-avatar-input-error" class="modal__error"></span>
          </label>
          <button
            type="submit"
            class="modal__submit-button modal__submit-button-avatar"
          >
            Save
          </button>
        </form>
      </div>
    </div>

    <div class="modal" id="delete-modal">
      <div class="modal__content modal__content-delete">
        <button
          aria-label="Close modal"
          class="modal__close-button modal__delete-close-button"
          type="button"
        ></button>
        <h3 class="modal__title modal__title-delete">
          Are you sure you want to delete this image?
        </h3>
        <form class="modal__form modal__form-delete" id="delete-form">
          <button
            class="modal__submit-button modal__delete-submit-button"
            type="submit"
          >
            Delete
          </button>
          <button
            class="modal__cancel-button modal__delete-cancel-button"
            type="button"
          >
            Cancel
          </button>
        </form>
      </div>
    </div>
  </body>
</html>
